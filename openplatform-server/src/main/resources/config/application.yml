spring:
  application:
    name: openplatform
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  threads:
    virtual:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/openplatform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&createDatabaseIfNotExist=true
    username: root
    password: 200594
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

server:
  port: 8000

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: tik
  is-log: true
  jwt-secret-key: openplatform-jwt-secret-key-2024

continew-starter:
  web:
    response:
      enabled: true
      custom-success-code: 0
      custom-error-code: 1
  auth:
    satoken:
      enabled: false
      security:
        excludes:
          - /auth/login
          - /captcha/**
          - /open-api/**
          - /doc.html
          - /webjars/**
          - /v3/api-docs/**
          - /swagger-resources/**
          - /swagger-ui/**
  log:
    interceptor:
      enabled: false
  trace:
    enabled: false
