  captcha:
    graphic:
      expirationInMinutes: 5
    behavior:
      enabled: false
  cache:
    jetcache:
      enabled: false
  ratelimiter:
    enabled: false
  data:
    mybatis-plus:
      enabled: true
  extension:
    crud:
      mybatis-plus:
        enabled: true
    datapermission:
      mybatis-plus:
        enabled: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 0
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  group-configs:
    - group: default
      display-name: 全部接口
      paths-to-match: /**
    - group: open-platform
      display-name: 开放平台
      paths-to-match: /open-platform/**, /open-api/**

logging:
  level:
    com.openplatform: debug
    top.continew: info